name: shipment-event-platform

services:
  api:
    image: shipment-event-platform-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TABLE_NAME: ${TABLE_NAME:-shipment-event-platform-dev}
      EVENT_BUS_NAME: ${EVENT_BUS_NAME:-shipment-event-platform-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHIPMENT_RETENTION_DAYS: ${SHIPMENT_RETENTION_DAYS:-30}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  worker:
    image: shipment-event-platform-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TABLE_NAME: ${TABLE_NAME:-shipment-event-platform-dev}
      EVENT_BUS_NAME: ${EVENT_BUS_NAME:-shipment-event-platform-dev}
      PROCESSING_QUEUE_URL: ${PROCESSING_QUEUE_URL:-http://host.docker.internal:4566/000000000000/shipment-event-platform-dev-processing}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-120}
      SHIPMENT_RETENTION_DAYS: ${SHIPMENT_RETENTION_DAYS:-30}
    stop_grace_period: 30s

  console:
    profiles: ["console"]
    image: shipment-event-platform-console:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/console.Dockerfile
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-}
      CONSOLE_TOKEN_URL: ${CONSOLE_TOKEN_URL:-}
      CONSOLE_CLIENT_ID: ${CONSOLE_CLIENT_ID:-}
      CONSOLE_CLIENT_SECRET: ${CONSOLE_CLIENT_SECRET:-}
      CONSOLE_SCOPES: ${CONSOLE_SCOPES:-shipment-api/shipments.write shipment-api/shipments.read}
      CONSOLE_SNS_TOPIC_ARN: ${CONSOLE_SNS_TOPIC_ARN:-}
      CONSOLE_REQUEST_TIMEOUT_SECONDS: ${CONSOLE_REQUEST_TIMEOUT_SECONDS:-15}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
