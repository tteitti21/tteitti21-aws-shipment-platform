[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shipment-event-platform"
version = "0.1.0"
description = "A learning-oriented, event-driven shipment API on AWS Fargate"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "cfn-lint>=1.31,<2",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "moto[dynamodb,events,sqs]>=5.0,<6",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["shipment_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true
